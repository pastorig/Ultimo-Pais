<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Último País</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: una columna tipo videojuego, todo en tonos muy oscuros con acentos de neón.
   Cada jugador tiene su color, el mapa de puntos se llena con cada país y el turno activo tiene un borde que gira. */
@property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
:root {
  color-scheme: dark;
  --bg: #04060F;
  --bg-2: #0B1030;
  --surface: rgba(255, 255, 255, 0.055);
  --surface-solid: #0E1330;
  --line: rgba(255, 255, 255, 0.13);
  --ink: #F4F6FF;
  --muted: #98A3D0;
  --sun: #FFD23F;
  --sun-edge: #B8901A;
  --sun-ink: #2A2100;
  --aqua: #2DD4D4;
  --coral: #FF5D73;
  --lime: #7BE05A;
  --sky: #4DA3FF;
  --violet: #9B6BFF;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --font-emoji: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}

/* Fondo vivo */
#bgfx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
  background: radial-gradient(1000px 600px at 50% 120%, #0d1a3d 0%, transparent 70%), var(--bg); }
.aurora { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .42; will-change: transform; animation: drift 26s ease-in-out infinite alternate; }
.aurora.a { width: 360px; height: 360px; background: #5B3DF5; top: -120px; right: -100px; }
.aurora.b { width: 320px; height: 320px; background: #0E9FA8; top: 38%; left: -140px; animation-duration: 32s; animation-delay: -8s; }
.aurora.c { width: 300px; height: 300px; background: #C2185B; bottom: -120px; right: -60px; opacity: .3; animation-duration: 38s; animation-delay: -15s; }
@keyframes drift { to { transform: translate(60px, 80px) scale(1.25); } }
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.7); } 50% { opacity: .95; transform: scale(1.2); } }
.fflag { position: absolute; bottom: -60px; font-family: var(--font-emoji); opacity: 0.14; animation: floatUp linear infinite; will-change: transform; }
@keyframes floatUp { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-115vh) rotate(12deg); } }
#vig { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; box-shadow: inset 0 0 120px 30px rgba(255, 60, 90, .75); transition: opacity .3s; }
#vig.on { opacity: 1; animation: vig .8s ease-in-out infinite alternate; }
@keyframes vig { from { opacity: .35; } to { opacity: 1; } }

#app, #fx { position: relative; z-index: 1; }
.wrap { max-width: 580px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.enter > :not(.turn) { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }
.enter > :nth-child(2) { animation-delay: .07s; } .enter > :nth-child(3) { animation-delay: .14s; }
.enter > :nth-child(4) { animation-delay: .21s; } .enter > :nth-child(5) { animation-delay: .28s; } .enter > :nth-child(6) { animation-delay: .35s; }
@keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* Encabezado */
header.top { display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; gap: 12px; }
.globe { width: 68px; height: 68px; flex: none; filter: drop-shadow(0 6px 20px rgba(45, 212, 212, .55)); animation: bobsm 4s ease-in-out infinite; }
@keyframes bobsm { 50% { transform: translateY(-4px) rotate(4deg); } }
.globe .roll { animation: roll 14s linear infinite; }
@keyframes roll { to { transform: translateX(-64px); } }
h1 {
  font-size: clamp(36px, 11vw, 54px); font-weight: 800; line-height: 1;
  background: linear-gradient(90deg, #FFD23F, #FF6BD6, #2DD4D4, #9B6BFF, #FFD23F); background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 8s linear infinite, titlein .8s cubic-bezier(.2, 1.3, .4, 1) both;
}
@keyframes flow { to { background-position: 300% 0; } }
@keyframes titlein { from { transform: translateX(-24px) scale(.8); opacity: 0; } }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.phase { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 5px 12px; border-radius: 99px; background: var(--sun); color: var(--sun-ink); box-shadow: 0 0 18px rgba(255, 210, 63, .45); }
.sound { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

input[type="text"] {
  font: inherit; font-size: 17px; color: var(--ink); background: rgba(0, 0, 0, .4);
  border: 2px solid var(--line); border-radius: 14px; padding: 13px 15px; width: 100%; min-width: 0; transition: border-color .2s, box-shadow .2s;
}
input[type="text"]::placeholder { color: var(--muted); opacity: .75; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
input[type="text"]:focus-visible { outline: none; border-color: var(--sun); box-shadow: 0 0 0 4px rgba(255, 210, 63, .22), 0 0 24px rgba(255, 210, 63, .2); }

.btn { border: 1.5px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink); border-radius: 14px; padding: 11px 16px; font-weight: 700; min-height: 46px; white-space: nowrap; transition: background .15s, transform .1s; position: relative; overflow: hidden; }
.btn:hover { background: rgba(255, 255, 255, .14); }
.btn.primary { background: linear-gradient(180deg, #FFE066, var(--sun)); border: 0; color: var(--sun-ink); font-weight: 800; box-shadow: 0 5px 0 var(--sun-edge), 0 10px 24px rgba(255, 210, 63, .25); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .65), transparent); transform: skewX(-20deg); animation: shine 3.4s ease-in-out infinite; }
@keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
.btn.primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sun-edge); }
.btn.danger { color: var(--coral); border-color: var(--coral); }
.btn.danger.solid { background: var(--coral); color: #2b0007; border: 0; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 10px; }
.btn.ghost:hover { color: var(--ink); background: rgba(255, 255, 255, .1); }
.btn.big { width: 100%; font-size: 19px; min-height: 58px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn[disabled]::after { display: none; }

/* Avatares */
.av { --s: 44px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: calc(var(--s) * .46); color: #0A0F2C;
  background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .65), transparent 48%), var(--pc); box-shadow: 0 0 0 3px rgba(255, 255, 255, .12), 0 0 18px color-mix(in srgb, var(--pc) 55%, transparent); }
.pop { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.plist li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; border-radius: 16px; background: linear-gradient(90deg, color-mix(in srgb, var(--pc) 16%, transparent), rgba(0, 0, 0, .25) 60%); border-left: 5px solid var(--pc); min-width: 0; animation: slidein .5s cubic-bezier(.2, 1.2, .4, 1) both; }
@keyframes slidein { from { opacity: 0; transform: translateX(-30px) scale(.96); } }
.pname { font-weight: 700; font-size: 17px; min-width: 64px; overflow-wrap: break-word; }
.plist .btn.ghost { padding: 8px 8px; min-height: 38px; font-size: 14px; }
.acts { display: flex; gap: 2px; margin-left: auto; }
.tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; background: rgba(255, 255, 255, .12); color: var(--muted); white-space: nowrap; }
.tag.me { background: var(--aqua); color: #04282B; }
.empty { text-align: center; padding: 18px 8px; border: 2px dashed var(--line); border-radius: 16px; }

/* Reglas */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: rgba(0, 0, 0, .35); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--tc); box-shadow: inset 0 20px 30px -24px var(--tc); }
.tile .tt { font-weight: 700; line-height: 1.2; }
.tile .hint { font-size: 13px; color: var(--muted); line-height: 1.3; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: auto; }
.stepper .val { font-family: var(--font-display); font-weight: 800; font-size: 26px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stepper .val.bump { animation: bump .3s; }
@keyframes bump { 40% { transform: scale(1.3); color: var(--sun); } }
.stepper .btn { width: 40px; padding: 0; font-size: 24px; line-height: 1; }
.switch { width: 62px; height: 34px; border-radius: 99px; border: 2px solid var(--line); background: rgba(255, 255, 255, .1); position: relative; padding: 0; margin-top: auto; transition: background .2s, border-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .25s cubic-bezier(.3, 1.5, .5, 1); }
.switch[aria-checked="true"] { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 16px rgba(123, 224, 90, .5); }
.switch[aria-checked="true"]::after { transform: translateX(28px); background: #0e2a06; }

/* Tablero */
.board { border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(145deg, #16206B, #070A24 70%); border: 1px solid var(--line); position: relative; overflow: hidden; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); }
.board::after { content: ""; position: absolute; right: -60px; top: -60px; width: 210px; height: 210px; border-radius: 50%; background: radial-gradient(circle, rgba(77, 163, 255, .45), transparent 70%); pointer-events: none; animation: pulseglow 5s ease-in-out infinite; }
@keyframes pulseglow { 50% { transform: scale(1.25); opacity: .6; } }
.board .big { font-family: var(--font-display); font-weight: 800; font-size: 84px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: var(--sun); text-shadow: 0 4px 28px rgba(255, 210, 63, .45); position: relative; z-index: 1; width: fit-content; }
.board .big.bump { animation: bump .5s; }
.board .foot { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; color: var(--muted); flex-wrap: wrap; position: relative; z-index: 1; }
.dots { display: grid; grid-template-columns: repeat(auto-fill, minmax(13px, 1fr)); gap: 4px; position: relative; z-index: 1; }
.dot { aspect-ratio: 1; border-radius: 4px; background: rgba(255, 255, 255, .1); animation: twdot 4s ease-in-out infinite; animation-delay: calc(var(--i) * -41ms); }
@keyframes twdot { 50% { background: rgba(255, 255, 255, .2); } }
.dot.on { background: var(--pc); box-shadow: 0 0 9px var(--pc); animation: none; }
.dot.fresh { animation: dotpop .9s ease-out both; }
@keyframes dotpop { 0% { transform: scale(.2); } 40% { transform: scale(2.2); } 100% { transform: scale(1); } }

/* Turno: borde que gira */
.turn {
  --pc: #fff; position: relative; border: 3px solid transparent; border-radius: 24px;
  background: linear-gradient(var(--surface-solid), var(--surface-solid)) padding-box,
    conic-gradient(from var(--ang), var(--pc), transparent 28%, var(--pc) 55%, transparent 80%, var(--pc)) border-box;
  animation: spin 3.6s linear infinite; box-shadow: 0 0 40px color-mix(in srgb, var(--pc) 30%, transparent), 0 20px 40px rgba(0, 0, 0, .5);
}
@keyframes spin { to { --ang: 360deg; } }
.turnhead.turnin { animation: turnin .55s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes turnin { from { opacity: 0; transform: translateX(40px) scale(.9); } }
.turn .who { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.05; overflow-wrap: anywhere; }
.ring { position: relative; width: 84px; height: 84px; flex: none; filter: drop-shadow(0 0 8px rgba(45, 212, 212, .5)); }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .bgc { stroke: rgba(255, 255, 255, .1); }
.ring .fgc { stroke: url(#rg); stroke-linecap: round; stroke-dasharray: 213.63; transition: stroke-dashoffset .5s linear; }
.ring .tnum { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
.ring .tnum.tk { animation: tk .35s ease-out; }
@keyframes tk { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
.ring.low { filter: drop-shadow(0 0 10px rgba(255, 93, 115, .9)); }
.ring.low .fgc { stroke: var(--coral); }
.ring.low .tnum { color: var(--coral); }

.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.slot { border: 2px dashed var(--line); border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; min-height: 64px; min-width: 0; color: var(--muted); }
.slot .num { font-family: var(--font-display); font-weight: 800; font-size: 22px; opacity: .6; }
.slot.done { border: 2px solid var(--lime); background: rgba(123, 224, 90, .13); color: var(--ink); box-shadow: 0 0 20px rgba(123, 224, 90, .25); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
.slot.active { border-color: var(--sun); color: var(--ink); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { background: rgba(255, 210, 63, .14); } }
.slot .sn { font-weight: 800; font-size: 15px; line-height: 1.15; overflow-wrap: break-word; }
.fl { font-family: var(--font-emoji); font-size: 32px; line-height: 1; flex: none; }
.fields { display: flex; flex-direction: column; gap: 10px; }
.err { color: #FFB3BD; background: rgba(255, 93, 115, .16); border: 1px solid rgba(255, 93, 115, .5); border-radius: 12px; padding: 9px 12px; font-weight: 600; font-size: 15px; animation: rise .3s both; }
.shake { animation: shake .45s; }
@keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

.pstrip { display: flex; flex-wrap: wrap; gap: 14px; }
.pchip { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 62px; position: relative; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
.pchip .n { font-size: 12px; font-weight: 700; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip.cur .av { animation: ping 1.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--pc), 0 0 18px var(--pc); } 100% { box-shadow: 0 0 0 18px transparent, 0 0 18px var(--pc); } }
.pchip.out .av { filter: grayscale(1) brightness(.55); box-shadow: none; }
.pchip.out .n { text-decoration: line-through; color: var(--muted); }
.pchip.out::after { content: "✕"; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 800; color: var(--coral); text-shadow: 0 0 10px var(--coral); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 99px; background: rgba(0, 0, 0, .4); border: 1.5px solid var(--pc); font-size: 15px; font-weight: 700; max-width: 100%; animation: pop .55s cubic-bezier(.2, 1.4, .4, 1) both; box-shadow: 0 0 12px color-mix(in srgb, var(--pc) 25%, transparent); }
.chip .fl { font-size: 22px; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.log li { padding: 5px 10px; border-left: 4px solid var(--line); background: rgba(0, 0, 0, .25); border-radius: 0 10px 10px 0; overflow-wrap: anywhere; animation: slidein .4s both; }
.log li.out { border-color: var(--coral); }
.log li.win { border-color: var(--lime); font-weight: 800; }
.log .r { color: var(--muted); font-size: 12px; font-weight: 800; margin-right: 6px; }

.winner { text-align: center; align-items: center; padding: 30px 16px; gap: 12px; position: relative; overflow: hidden; background: linear-gradient(160deg, rgba(255, 210, 63, .16), var(--surface)); }
.winner > * { position: relative; z-index: 1; }
.winner::before { content: ""; position: absolute; left: 50%; top: 38%; width: 520px; height: 520px; margin: -260px 0 0 -260px; z-index: 0;
  background: repeating-conic-gradient(from 0deg, rgba(255, 210, 63, .22) 0 10deg, transparent 10deg 20deg); border-radius: 50%;
  -webkit-mask: radial-gradient(circle, #000 0, transparent 68%); mask: radial-gradient(circle, #000 0, transparent 68%); animation: rays 18s linear infinite; }
@keyframes rays { to { transform: rotate(360deg); } }
.winner .crown { width: 84px; animation: bob 1.8s ease-in-out infinite; filter: drop-shadow(0 0 16px rgba(255, 210, 63, .7)); }
@keyframes bob { 50% { transform: translateY(-8px) rotate(3deg); } }
.winner .wname { font-family: var(--font-display); font-weight: 800; font-size: clamp(38px, 12vw, 56px); line-height: 1; overflow-wrap: anywhere; color: var(--sun); text-shadow: 0 4px 30px rgba(255, 210, 63, .5); }

.notice { border: 1.5px solid var(--sun); color: var(--sun); border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 600; background: rgba(255, 210, 63, .08); }
details summary { cursor: pointer; font-weight: 700; }
details ul { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 14px; font-weight: 700; font-size: 15px; max-width: calc(100% - 32px); z-index: 20; animation: rise .3s both; }

/* Efectos a pantalla completa */
.ov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 45%, rgba(255, 93, 115, .5), rgba(4, 6, 15, .95) 70%); animation: ovin .25s both; cursor: pointer; }
.ov.bye { animation: ovout .5s both; }
.ov.soft { background: radial-gradient(circle at 50% 50%, rgba(155, 107, 255, .35), rgba(4, 6, 15, .85) 72%); pointer-events: none; animation: ovin .2s both, ovout .4s 1.1s both; }
.ov-in { animation: slam .5s cubic-bezier(.2, 1.5, .4, 1) both; }
.ov-big { font-family: var(--font-display); font-weight: 800; font-size: clamp(64px, 22vw, 120px); line-height: 1; color: var(--coral); text-shadow: 0 6px 40px rgba(255, 93, 115, .8); }
.ov.soft .ov-big { color: var(--sun); text-shadow: 0 6px 40px rgba(255, 210, 63, .7); font-size: clamp(54px, 18vw, 100px); }
.ov-name { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 9vw, 44px); overflow-wrap: anywhere; }
.ov-sub { color: var(--muted); font-size: 18px; font-weight: 600; margin-top: 4px; }
@keyframes ovin { from { opacity: 0; } }
@keyframes ovout { to { opacity: 0; } }
@keyframes slam { 0% { transform: scale(2.6) rotate(-6deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.quake { animation: quake .6s; }
@keyframes quake { 10%, 50%, 90% { transform: translate(-6px, 3px); } 30%, 70% { transform: translate(6px, -3px); } }
.spark { position: fixed; width: 9px; height: 9px; border-radius: 50%; z-index: 55; pointer-events: none; animation: spark .75s ease-out forwards; }

function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[.,'’"]/g, '').replace(/-/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(el|la|los|las) /, '');
}
const COUNTRIES = COUNTRY_SRC.split('\n').map(line => {
  const [c, n, ...al] = line.split('|');
  return { c, n, k: norm(n), keys: [norm(n), ...al.map(norm)] };
});
const KEYMAP = new Map();
COUNTRIES.forEach(e => e.keys.forEach(k => KEYMAP.set(k, e)));
function flag(c) { return c && c.length === 2 ? String.fromCodePoint(...[...c].map(ch => 127397 + ch.charCodeAt(0))) : '🌍'; }
function cap(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
const slug = k => String(k).replace(/[^a-z0-9]+/g, '_');

function lev(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}
function lookup(raw) {
  const k = norm(raw);
  if (!k) return null;
  if (KEYMAP.has(k)) return KEYMAP.get(k);
  if (k.length >= 7) {
    let found = null;
    for (const [key, e] of KEYMAP) {
      if (key.length >= 7 && Math.abs(key.length - k.length) <= 1 && lev(k, key) <= 1) {
        if (found && found !== e) return null;
        found = e;
      }
    }
    return found;
  }
  return null;
}

/* ---------- Lógica de la partida ---------- */
const PALETTE = ['#FF5D73', '#FFB547', '#7BE05A', '#2DD4D4', '#4DA3FF', '#9B6BFF', '#FF6BD6', '#FF8A3D'];
const colorOf = i => PALETTE[(((i || 0) % 8) + 8) % 8];
const MIN_SEC = 10, MAX_SEC = 300;
function defaultState() {
  return { phase: 'lobby', config: { perTurn: 2, seconds: 30, validate: true }, hostId: null, seq: 0, logN: 0,
    roster: [], cur: 0, round: 1, deadline: null, got: [], used: [], log: [], winner: null };
}
function addLog(s, kind, txt, extra) {
  s.logN = (s.logN || 0) + 1;
  s.log.push({ i: s.logN, k: kind, r: s.round, t: txt, ...(extra || {}) });
  if (s.log.length > 40) s.log.shift();
}
function setDeadline(s) { s.deadline = Date.now() + Math.max(MIN_SEC, s.config.seconds || 30) * 1000; }
function nextTurn(s) {
  s.got = [];
  const alive = s.roster.filter(p => p.alive);
  if (alive.length <= 1) {
    s.phase = 'over'; s.deadline = null; s.winner = alive[0] ? alive[0].id : null;
    addLog(s, 'win', alive[0] ? `Ganó ${alive[0].name}` : 'Nadie ganó', { w: alive[0] ? alive[0].name : '' });
    return;
  }
  const n = s.roster.length;
  for (let step = 1; step <= n; step++) {
    const idx = (s.cur + step) % n;
    if (s.roster[idx].alive) { if (s.cur + step >= n) s.round++; s.cur = idx; break; }
  }
  setDeadline(s);
}
function eliminate(s) {
  const p = s.roster[s.cur];
  const had = (s.got || []).length, need = s.config.perTurn;
  p.alive = false;
  addLog(s, 'out', `${p.name} queda afuera: se acabó el tiempo (${had} de ${need})`, { w: p.name, why: `Se acabó el tiempo · ${had} de ${need} países` });
  nextTurn(s);
}
function submitCountry(s, forId, raw) {
  if (s.phase !== 'playing') return { error: 'La partida no está en curso.' };
  const p = s.roster[s.cur];
  if (!p || p.id !== forId) return { error: 'Ya no es tu turno.' };
  if (s.deadline && Date.now() > s.deadline + 1500) return { error: 'Se acabó el tiempo.' };
  const txt = raw.trim();
  if (!txt) return { error: 'Escribí un país.' };
  let it;
  if (s.config.validate) {
    const e = lookup(txt);
    if (!e) return { error: `No reconozco "${txt}". Revisá cómo está escrito.`, keep: true };
    it = { k: e.k, n: e.n, c: e.c };
  } else it = { k: norm(txt), n: cap(txt), c: '' };
  if (!it.k) return { error: 'Escribí un país.' };
  const dup = s.used.find(u => u.k === it.k);
  if (dup) return { error: `${it.n} ya lo dijo ${dup.by}. No cuenta, probá con otro.` };
  s.used.push({ k: it.k, n: it.n, c: it.c, by: p.name, ci: p.ci, r: s.round });
  s.got = s.got || [];
  s.got.push({ n: it.n, c: it.c });
  if (s.got.length >= s.config.perTurn) {
    addLog(s, 'say', `${p.name}: ${s.got.map(g => g.n).join(', ')}`);
    nextTurn(s);
  }
  return { state: s };
}

function tone(f, d, delay = 0, type = 'sine', vol = 0.08) {

    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

function confetti() {
  if (reduced()) return;

  document.getElementById('fx').append(cv);
  const ctx = cv.getContext('2d'), cols = [...PALETTE, '#FFD23F'];

    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));

function tween(el, from, to, ms = 800) {

  const t0 = performance.now();
  (function step(t) {

(function backdrop() {

/* ---------- Conexión ---------- */
let db = null, uid = null, stateRef = null, playersRef = null;

let fresh = new Set(), canActNow = false, burstTarget = false;
const $app = document.getElementById('app');

function localId() {
  try {
    let v = localStorage.getItem('ultimo-pais-id');
    if (!v) { v = 'u' + Math.random().toString(36).slice(2, 10); localStorage.setItem('ultimo-pais-id', v); }
    return v;
  } catch (e) { return 'u' + Math.random().toString(36).slice(2, 10); }
}
function toast(msg) {
  toastMsg = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastMsg = ''; render(); }, 3200);
}
function setState(next) {
  const prev = S;
  const turnChanged = prev.cur !== next.cur || prev.round !== next.round || prev.phase !== next.phase;
  if (turnChanged) {
    formErr = '';
    const ti = document.getElementById('turn-input'); if (ti) ti.value = '';
  }
  S = next;
  const first = seenLog === null;
  const maxLog = next.log.length ? Math.max(...next.log.map(l => l.i || 0)) : 0;
  if (first) { seenLog = maxLog; seenUsed = next.used.length; }
  else {
    if (maxLog < seenLog) seenLog = maxLog;
    if (next.used.length < seenUsed) seenUsed = next.used.length;
    if (next.used.length > seenUsed) {
      next.used.slice(seenUsed).forEach(u => fresh.add(u.k));
      seenUsed = next.used.length; burstTarget = true;
      if (next.phase !== 'lobby') sfx.ok();
    }
    next.log.filter(l => (l.i || 0) > seenLog).forEach(l => {
      if (l.k === 'out') { showOut(l.w, l.why); sfx.out(); }
      if (l.k === 'win') { confetti(); sfx.win(); }
    });
    if (maxLog > seenLog) seenLog = maxLog;
    if (prev.phase !== 'playing' && next.phase === 'playing') { banner('¡A jugar!', `${next.roster.length} jugadores · ${next.config.perTurn} por turno`); sfx.go(); }
    else if (prev.phase === 'playing' && next.phase === 'playing' && next.round > prev.round) banner('Ronda ' + next.round);
  }

}

let chain = Promise.resolve();
function mutate(fn) {
  const job = chain.then(async () => {
    if (!stateRef) throw new Error('offline');
    const snap = await stateRef.get();
    const cur = snap.exists ? { ...defaultState(), ...JSON.parse(JSON.stringify(snap.data())) } : defaultState();
    const res = fn(cur);
    if (!res || res.error) return res;
    res.state.seq = (cur.seq || 0) + 1;
    await stateRef.set(res.state);
    setState(res.state);
    return res;
  });
  chain = job.catch(() => {});
  return job;
}
async function run(fn) {
  if (!stateRef) { toast('Sin conexión con la partida. Abrí el link con tu sesión iniciada.'); return null; }
  busy = true; render();
  try {
    const res = await mutate(fn);
    if (res && res.error) { formErr = res.error; shakeNext = true; sfx.bad(); }
    else formErr = '';
    return res;
  } catch (e) { toast('No se pudo guardar. Probá de nuevo.'); return null; }
  finally { busy = false; render(); }
}
async function dbDo(fn) {
  if (!playersRef) { toast('Sin conexión con la partida. Abrí el link con tu sesión iniciada.'); return; }
  try { await fn(); } catch (e) { toast('No se pudo guardar. Probá de nuevo.'); }
}

function actJoin(name) {

  dbDo(() => playersRef.doc(uid).set({ name, at: Date.now(), manual: false }));
}
function actRename(id, name) {
  name = name.trim().slice(0, 24); if (!name) return;
  editingId = null;

}
function actAddManual(name) {
  name = name.trim().slice(0, 24); if (!name) return;
  dbDo(() => playersRef.doc('m' + Math.random().toString(36).slice(2, 9)).set({ name, at: Date.now(), manual: true }));
}
function actRemove(id) { dbDo(() => playersRef.doc(id).delete()); }
function actConfig(key, val) {
  run(s => { if (s.phase !== 'lobby') return null; s.config[key] = val; return { state: s }; });
}
function actStart() {
  if (P.length < 2) return toast('Hacen falta al menos 2 jugadores.');
  const players = P.map((p, i) => ({ ...p, ci: i }));
  for (let i = players.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [players[i], players[j]] = [players[j], players[i]]; }
  run(s => {
    if (s.phase === 'playing') return null;
    s.phase = 'playing'; s.hostId = uid; s.used = []; s.log = []; s.logN = 0; s.got = []; s.winner = null; s.round = 1; s.cur = 0;
    s.config.seconds = Math.min(MAX_SEC, Math.max(MIN_SEC, s.config.seconds || 30));
    s.roster = players.map(p => ({ id: p.id, name: p.name, alive: true, manual: !!p.manual, ci: p.ci }));
    addLog(s, 'say', `Empieza la partida. Primero: ${s.roster[0].name}`);
    setDeadline(s);
    return { state: s };
  });
}
async function actSubmit(forId) {
  const el = document.getElementById('turn-input');
  const raw = el ? el.value : '';
  if (el) el.value = '';
  const res = await run(s => submitCountry(s, forId, raw));
  const e2 = document.getElementById('turn-input');
  if (e2) { if (res && res.error && res.keep) { e2.value = raw; e2.select(); } e2.focus(); }
}
function actTimeout(expectSeq) {
  return run(s => {
    if (s.phase !== 'playing' || s.seq !== expectSeq) return null;
    eliminate(s); return { state: s };
  });
}
function actReset() {
  confirmAct = null;
  run(s => ({ state: { ...defaultState(), config: s.config, seq: s.seq } }));
}
function toggleMute() { muted = !muted; try { localStorage.setItem('up-mute', muted ? '1' : '0'); } catch (e) {} if (!muted) sfx.ok(); render(); }

/* ---------- Vista ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) { (e._on = e._on || {})[k.slice(2)] = v; }
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;

  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}

const GLOBE = `<svg viewBox="0 0 64 64" class="globe" aria-hidden="true"><defs>

<g clip-path="url(#gc)"><g class="roll" fill="#7BE05A" opacity=".92">
<g id="cont"><path d="M6 20C10 12 20 12 24 18C27 24 20 28 22 34C16 36 8 32 6 20Z"/><path d="M34 14C42 10 52 14 54 22C50 26 44 24 42 30C36 28 32 20 34 14Z"/><path d="M28 42C36 38 46 44 44 52C38 58 28 54 28 42Z"/></g>
<use href="#cont" x="64"/><use href="#cont" x="128"/></g></g>
<circle cx="32" cy="32" r="29" fill="url(#gs)"/><ellipse cx="24" cy="18" rx="9" ry="5" fill="#fff" opacity=".28" transform="rotate(-30 24 18)"/></svg>`;

function headerView() {
  const phase = { lobby: 'Sala', playing: 'En juego', over: 'Final' }[S.phase];
  return h('header', { class: 'top' },
    h('div', { class: 'toprow' }, h('span', { class: 'phase', text: phase }),
      h('button', { class: 'sound', 'aria-pressed': String(!muted), onclick: toggleMute, text: muted ? 'Sonido: no' : 'Sonido: sí' })),
    h('div', { class: 'brand' }, h('div', { html: GLOBE, 'data-keep': true, style: 'display:contents' }), h('h1', { text: 'Último País' })),
    h('p', { class: 'muted', text: 'Nombrá países sin repetir antes de que se acabe el tiempo. El último en pie gana.' }));
}

function lobbyView() {
  const mine = P.find(p => p.id === uid);
  const joinForm = mine ? null : h('div', { class: 'row', id: 'join-row' },
    h('input', { type: 'text', id: 'join-name', placeholder: 'Tu nombre', maxlength: '24', autocomplete: 'off', onkeydown: enterTo(() => actJoin(inputVal('join-name'))) }),
    h('button', { class: 'btn primary', onclick: () => actJoin(inputVal('join-name')) }, 'Entrar'));
  const list = P.length

      h('div', { class: 'row between' }, h('h2', { text: 'Jugadores' }), h('span', { class: 'label', text: P.length + ' en la sala' })),
      joinForm, list,
      h('div', { class: 'row' },
        h('input', { type: 'text', id: 'add-name', placeholder: 'Sumar a alguien sin celular', maxlength: '24', autocomplete: 'off',
          onkeydown: enterTo(() => { actAddManual(inputVal('add-name')); document.getElementById('add-name').value = ''; }) }),
        h('button', { class: 'btn', onclick: () => { actAddManual(inputVal('add-name')); document.getElementById('add-name').value = ''; } }, 'Sumar'))),
    h('section', { class: 'panel', id: 'sec-rules' },
      h('h2', { text: 'Reglas de la partida' }),
      h('div', { class: 'tiles' },
        stepTile('t-per', '#4DA3FF', 'Países por turno', 'Los que hay que decir en cada turno', String(cfg.perTurn),
          () => actConfig('perTurn', cfg.perTurn - 1), () => actConfig('perTurn', cfg.perTurn + 1), cfg.perTurn <= 1, cfg.perTurn >= 10),
        stepTile('t-sec', '#FF5D73', 'Tiempo por turno', 'De a 5 segundos. Si se acaba y faltan países, quedás afuera', cfg.seconds + 's',
          () => actConfig('seconds', Math.max(MIN_SEC, cfg.seconds - 5)), () => actConfig('seconds', Math.min(MAX_SEC, cfg.seconds + 5)), cfg.seconds <= MIN_SEC, cfg.seconds >= MAX_SEC),
        h('div', { class: 'tile', id: 't-val', style: '--tc:#7BE05A' },
          h('div', {}, h('div', { class: 'tt', text: 'Validar países' }), h('div', { class: 'hint', text: 'Acepta tildes y nombres comunes (EEUU, Holanda)' })),
          h('button', { class: 'switch', role: 'switch', 'aria-checked': String(cfg.validate), 'aria-label': 'Validar países', onclick: () => actConfig('validate', !cfg.validate) })))),
    h('button', { class: 'btn primary big', id: 'start-btn', disabled: busy || P.length < 2, onclick: actStart }, P.length < 2 ? 'Faltan jugadores (mínimo 2)' : '¡Empezar partida!'),
    h('details', { class: 'panel', id: 'sec-how' }, h('summary', { text: 'Cómo se juega' }),
      h('ul', {},
        h('li', { text: 'El orden de los turnos se sortea.' }),
        h('li', { text: 'En tu turno tenés que decir la cantidad de países configurada antes de que se acabe el tiempo.' }),
        h('li', { text: 'Si decís un país que ya se dijo, no cuenta: probás con otro.' }),
        h('li', { text: 'La única forma de quedar afuera es que se acabe el tiempo sin haber dicho todos tus países.' }),
        h('li', { text: 'Cuantos más países se dicen, menos quedan. Gana la última persona en pie.' }))));
}

function playerChips() {
  return h('div', { class: 'pstrip' }, S.roster.map((p, i) =>
    h('div', { id: 'pc-' + p.id, class: 'pchip' + (!p.alive ? ' out' : '') + (p.alive && i === S.cur ? ' cur' : ''), style: `--pc:${colorOf(p.ci)}` },
      avatar(p.name, p.ci, 46), h('span', { class: 'n', text: p.name }))));
}

function gameView() {
  const cp = S.roster[S.cur];
  const myTurn = cp && cp.id === uid;
  const hostActs = cp && cp.manual && S.hostId === uid;
  const canAct = !!(myTurn || hostActs);
  canActNow = canAct;
  const total = COUNTRIES.length;
  const usedN = S.used.length;
  const left = Math.max(0, total - usedN);
  const need = S.config.perTurn;
  const got = S.got || [];

  const dots = S.config.validate ? h('div', { class: 'dots', id: 'dots', 'aria-hidden': 'true' },
    Array.from({ length: total }, (_, i) => {
      const u = S.used[i];
      return h('i', { id: 'dot-' + i, class: 'dot' + (u ? ' on' : '') + (u && fresh.has(u.k) ? ' fresh' : ''), style: u ? `--pc:${colorOf(u.ci)};--i:${i}` : `--i:${i}` });
    })) : null;
  const board = h('section', { class: 'board', id: 'board' },
    h('div', { class: 'label', text: S.config.validate ? 'Países sin decir' : 'Países dichos' }),
    h('div', { class: 'big', id: 'bignum', 'data-v': String(S.config.validate ? left : usedN), text: String(S.config.validate ? left : usedN) }),
    dots,
    h('div', { class: 'foot' }, h('span', { text: 'Ronda ' + S.round }), h('span', { text: usedN + ' dichos · ' + S.roster.filter(p => p.alive).length + ' en pie' })));

  const slots = h('div', { class: 'slots', id: 'slots' }, Array.from({ length: need }, (_, i) => {
    const g = got[i];
    if (g) return h('div', { id: 'slot-' + i + '-done', class: 'slot done' }, h('span', { class: 'fl', text: flag(g.c) }), h('span', { class: 'sn', text: g.n }));
    return h('div', { id: 'slot-' + i, class: 'slot' + (i === got.length ? ' active' : '') }, h('span', { class: 'num', text: String(i + 1) }), h('span', { class: 'small', text: i === got.length ? 'Falta este' : '' }));
  }));
  const ring = h('div', { class: 'ring', id: 'ring', 'data-keep': true, html: '<svg viewBox="0 0 80 80" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4D4"/><stop offset="1" stop-color="#9B6BFF"/></linearGradient></defs><circle class="bgc" cx="40" cy="40" r="34"/><circle class="fgc" id="rfg" cx="40" cy="40" r="34"/></svg><span class="tnum" id="tnum"></span>' });
  const turn = h('section', { class: 'panel turn', id: 'turn', style: `--pc:${colorOf(cp && cp.ci)}` },
    h('div', { class: 'row turnhead', id: 'turnhead' },
      avatar(cp ? cp.name : '', cp && cp.ci, 56),
      h('div', { class: 'grow' },
        h('div', { class: 'label', text: myTurn ? 'Tu turno' : hostActs ? 'Turno de alguien sin celular' : 'Turno de' }),
        h('div', { class: 'who', text: cp ? cp.name : '' })),
      ring),
    slots,
    canAct ? h('div', { class: 'fields', id: 'fields' },
      h('div', { class: 'row' + (shakeNext ? ' shake' : ''), id: 'inrow' },
        h('input', { type: 'text', id: 'turn-input', placeholder: `País ${Math.min(got.length + 1, need)} de ${need}`, autocomplete: 'off', autocapitalize: 'words', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'send',
          onkeydown: enterTo(() => actSubmit(cp.id)) }),
        h('button', { class: 'btn primary', id: 'send-btn', disabled: busy, onmousedown: ev => ev.preventDefault(), onclick: () => actSubmit(cp.id) }, 'Enviar')),
      formErr ? h('div', { class: 'err', role: 'alert', text: formErr }) : null)
      : h('p', { class: 'muted', id: 'waiting', text: 'Esperando que ' + (cp ? cp.name : '') + ' diga ' + (need === 1 ? 'un país' : need + ' países') + '…' }),
    h('button', { class: 'btn danger', id: 'timeout-btn', hidden: true, onclick: () => actTimeout(S.seq) }, 'Se acabó el tiempo: sacar del juego'));
  shakeNext = false;

  const players = h('section', { class: 'panel', id: 'sec-pl' }, h('h2', { text: 'Jugadores' }), playerChips());

  const usedList = S.used.slice().reverse();
  const used = h('section', { class: 'panel', id: 'sec-used' },
    h('div', { class: 'row between' }, h('h2', { text: 'Ya dichos' }), h('span', { class: 'label', text: String(usedN) })),
    usedN ? h('div', { class: 'chips', id: 'chips' }, usedList.map(u => h('span', { id: 'chip-' + slug(u.k), class: 'chip', style: `--pc:${colorOf(u.ci)}`, title: u.by },
      h('span', { class: 'fl', text: flag(u.c) }), u.n)))
      : h('p', { class: 'muted', id: 'chips', text: 'Todavía no se dijo ningún país.' }));

  const log = h('section', { class: 'panel', id: 'sec-log' },
    h('h2', { text: 'Jugadas' }),
    h('ul', { class: 'log', id: 'log' }, S.log.slice(-8).reverse().map(l => h('li', { id: 'lg-' + l.i, class: l.k }, h('span', { class: 'r', text: 'R' + l.r }), l.t))));

  const ctrl = h('div', { class: 'row', id: 'ctrl', style: 'justify-content:center; flex-wrap:wrap' },
    confirmAct === 'reset'
      ? [h('button', { class: 'btn danger solid', onclick: () => actReset() }, 'Sí, terminar partida'), h('button', { class: 'btn', onclick: () => { confirmAct = null; render(); } }, 'Cancelar')]
      : h('button', { class: 'btn ghost', onclick: () => { confirmAct = 'reset'; render(); } }, 'Terminar partida'));

  return h('div', { class: 'stack enter', id: 'view-playing' }, board, turn, players, used, log, ctrl);
}

const CROWN = `<svg viewBox="0 0 64 48" class="crown" aria-hidden="true"><path d="M6 40 L2 12 L18 24 L32 6 L46 24 L62 12 L58 40Z" fill="#FFD23F" stroke="#B8901A" stroke-width="3" stroke-linejoin="round"/><rect x="6" y="40" width="52" height="6" rx="3" fill="#FFB547"/><circle cx="2" cy="12" r="3.5" fill="#FF5D73"/><circle cx="32" cy="6" r="3.5" fill="#2DD4D4"/><circle cx="62" cy="12" r="3.5" fill="#FF6BD6"/></svg>`;
function overView() {
  const w = S.roster.find(p => p.id === S.winner);
  return h('div', { class: 'stack enter', id: 'view-over' },
    h('section', { class: 'panel winner', id: 'sec-win' },
      h('div', { html: CROWN, style: 'display:contents' }),
      w ? avatar(w.name, w.ci, 84) : null,
      h('div', { class: 'label', text: 'Último en pie' }),
      h('div', { class: 'wname', text: w ? w.name : 'Nadie' }),
      h('p', { class: 'muted', text: `${S.used.length} países dichos en ${S.round} ${S.round === 1 ? 'ronda' : 'rondas'}.` }),
      h('button', { class: 'btn primary big', id: 'again-btn', disabled: busy, onclick: () => actReset() }, 'Nueva partida')),
    h('section', { class: 'panel', id: 'sec-pl' }, h('h2', { text: 'Jugadores' }), playerChips()),
    S.used.length ? h('section', { class: 'panel', id: 'sec-used' }, h('h2', { text: 'Países dichos' }),
      h('div', { class: 'chips' }, S.used.map(u => h('span', { id: 'chip-' + slug(u.k), class: 'chip', style: `--pc:${colorOf(u.ci)}`, title: u.by }, h('span', { class: 'fl', text: flag(u.c) }), u.n)))) : null,
    h('section', { class: 'panel', id: 'sec-log' }, h('h2', { text: 'Cómo terminó' }),
      h('ul', { class: 'log' }, S.log.slice(-12).reverse().map(l => h('li', { id: 'lg-' + l.i, class: l.k }, h('span', { class: 'r', text: 'R' + l.r }), l.t)))));
}

function keepNode(from, to) {
  from._on = to._on;
  if (from.tagName === 'INPUT') { if (from.placeholder !== to.placeholder) from.placeholder = to.placeholder; return false; }
  if (from.id === 'bignum') { from.dataset.v = to.dataset.v; return false; }
  if (from.dataset && from.dataset.keep !== undefined) return false;
  return true;
}
function render() {
  canActNow = false;
  const body = S.phase === 'playing' ? gameView() : S.phase === 'over' ? overView() : lobbyView();
  if (S.phase === 'lobby') { body.id = 'view-lobby'; body.classList.add('enter'); }
  const notices = [];
  if (!connected && slow) notices.push(h('div', { class: 'notice', id: 'notice', role: 'status', text: 'No hay conexión con la partida todavía. Si el problema sigue, abrí el link con tu sesión iniciada.' }));
  const next = h('div', { id: 'app' }, h('div', { class: 'wrap' }, headerView(), notices, body, toastMsg ? h('div', { class: 'toast', id: 'toast', role: 'status', text: toastMsg }) : null));
  if (window.morphdom) morphdom($app, next, { onBeforeElUpdated: keepNode });
  else $app.replaceChildren(...next.childNodes);

  const bn = document.getElementById('bignum');
  if (bn) {
    const target = +bn.dataset.v;
    if (shownLeft === null) { shownLeft = target; bn.textContent = target; }
    else if (shownLeft !== target) { tween(bn, shownLeft, target); shownLeft = target; }
  } else shownLeft = null;
  document.querySelectorAll('.stepper .val').forEach(v => {
    if (v.dataset.shown !== undefined && v.dataset.shown !== v.dataset.v) retrigger(v, 'bump');
    v.dataset.shown = v.dataset.v;
  });
  if (S.phase === 'playing') {
    const key = S.round + ':' + S.cur;
    if (lastCur !== key) {
      retrigger(document.getElementById('turnhead'), 'turnin');
      if (lastCur !== null) sfx.turn();
      lastCur = key;
    }
    if (burstTarget) {
      burstTarget = false;
      burstAt(document.querySelector('#slots .slot.done:last-of-type') || document.getElementById('turn'));
    }
    const ti = document.getElementById('turn-input');
    if (ti && canActNow && focusedFor !== key) { focusedFor = key; if (!(document.activeElement && document.activeElement.tagName === 'INPUT')) ti.focus(); }
  } else { lastCur = null; focusedFor = null; burstTarget = false; document.getElementById('vig').classList.remove('on'); }
  fresh = new Set();
  tick();
}

/* ---------- Reloj ---------- */
let lastTry = 0, enforcing = false;
function tick() {
  if (S.phase !== 'playing' || !S.deadline) return;
  const tn = document.getElementById('tnum'); if (!tn) return;
  const rem = S.deadline - Date.now();
  const total = Math.max(MIN_SEC, S.config.seconds || 30) * 1000;
  const sec = Math.max(0, Math.ceil(rem / 1000));
  if (String(sec) !== tn.textContent) {
    tn.textContent = sec; retrigger(tn, 'tk');
    if (canActNow && sec > 0 && sec <= 5) sfx.tick();
  }
  const fg = document.getElementById('rfg');
  if (fg) fg.style.strokeDashoffset = String(213.63 * (1 - Math.max(0, Math.min(1, rem / total))));
  document.getElementById('ring').classList.toggle('low', rem < 10000);
  document.getElementById('vig').classList.toggle('on', rem < 5000 && rem > -1500 && canActNow);
  const btn = document.getElementById('timeout-btn');
  if (btn) btn.hidden = rem > -4000;
  if (rem < -1500 && S.hostId === uid && !busy && !enforcing && Date.now() - lastTry > 3000) {
    lastTry = Date.now(); enforcing = true;
    actTimeout(S.seq).finally(() => { enforcing = false; });
  }
}
setInterval(tick, 400);

/* ---------- Arranque ---------- */
(async function boot() {
  render();
  const claude = window.claude;
  if (!claude || !claude.use) { slow = true; render(); return; }
  setTimeout(() => { if (!connected) { slow = true; render(); } }, 10000);
  try {
    const user = await claude.use('user');
    uid = user ? await user.id() : null;
  } catch (e) { uid = null; }
  if (!uid) uid = localId();
  db = await claude.use('db');
  if (!db) { slow = true; render(); return; }
  stateRef = db.doc('game/state');
  playersRef = db.collection('players');
  stateRef.onSnapshot(snap => {
    connected = true;
    setState(snap.exists ? { ...defaultState(), ...snap.data() } : defaultState());
  }, () => { slow = true; render(); });
  playersRef.onSnapshot(q => {
    connected = true;
    P = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.at || 0) - (b.at || 0));
    render();
  }, () => { slow = true; render(); });
})();
</script>
