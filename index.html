<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Último País</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E"><style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Special+Elite&family=Space+Mono:wght@400;700&family=Figtree:wght@400..800&family=Noto+Color+Emoji&display=swap">
<style>
/* Concepto: control de pasaportes en un aeropuerto de noche.
   Tablero de salidas ámbar con letras que giran, pases de abordar para los jugadores,
   un mapa de destinos que se enciende y sellos de pasaporte para cada país dicho. */
@property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
:root {
  color-scheme: dark;
  --bg: #05070D;
  --panel: #0B1120;
  --panel-2: #121B33;
  --line: rgba(255, 255, 255, 0.11);
  --line-2: rgba(255, 255, 255, 0.22);
  --ink: #F2F0E8;
  --muted: #8F9ABA;
  --amber: #FFB000;
  --amber-2: #FFD36B;
  --amber-ink: #241800;
  --red: #FF4D5E;
  --green: #4FE08A;
  --cyan: #35D6E6;
  --f-board: 'Big Shoulders Display', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
  --f-stamp: 'Special Elite', 'Courier New', monospace;
  --f-mono: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-emoji: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); overflow-x: clip; }
.notice, .tt { overflow-wrap: anywhere; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--f-body);
  padding-block: 14px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: clip; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Fondo: noche de aeropuerto */
#bgfx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
  background: radial-gradient(800px 460px at 100% -8%, rgba(255, 176, 0, .12), transparent 62%), radial-gradient(640px 480px at -12% 38%, rgba(53, 214, 230, .09), transparent 62%), linear-gradient(#05070D, #070C18); }
#bgfx::before { content: ""; position: absolute; left: -40%; right: -40%; bottom: -5%; height: 62%;
  background-image: linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px);
  background-size: 46px 46px; transform: perspective(520px) rotateX(62deg); transform-origin: center bottom;
  -webkit-mask-image: linear-gradient(transparent, #000 70%); mask-image: linear-gradient(transparent, #000 70%); }
.radar { position: absolute; width: 560px; height: 560px; right: -300px; top: 8%; border-radius: 50%; opacity: .5;
  background: conic-gradient(from 0deg, rgba(255, 176, 0, .35), rgba(255, 176, 0, 0) 22%, transparent 100%);
  -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 70%); mask-image: radial-gradient(circle, #000 20%, transparent 70%);
  animation: rot 9s linear infinite; will-change: transform; }
@keyframes rot { to { transform: rotate(360deg); } }
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .1; transform: scale(.7); } 50% { opacity: .85; transform: scale(1.2); } }
.fflag { position: absolute; bottom: -60px; font-family: var(--f-emoji); opacity: .12; animation: floatUp linear infinite; will-change: transform; }
@keyframes floatUp { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-115vh) rotate(12deg); } }
#vig { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; box-shadow: inset 0 0 110px 26px rgba(255, 60, 90, .7); transition: opacity .3s; }
#vig.on { opacity: 1; animation: vig .8s ease-in-out infinite alternate; }
@keyframes vig { from { opacity: .3; } to { opacity: 1; } }

#app, #fx { position: relative; z-index: 1; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.enter > :not(.turn) { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }
.enter > :nth-child(2) { animation-delay: .07s; } .enter > :nth-child(3) { animation-delay: .14s; }
.enter > :nth-child(4) { animation-delay: .21s; } .enter > :nth-child(5) { animation-delay: .28s; } .enter > :nth-child(6) { animation-delay: .35s; }
@keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }

p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.k { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }

/* Encabezado */
.hdr { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip-st { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border-radius: 6px; background: var(--amber); color: var(--amber-ink); box-shadow: 0 0 18px rgba(255, 176, 0, .4); }
.room { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 6px; padding: 4px 9px; }
.sound { background: none; border: 1px solid var(--line-2); color: var(--muted); border-radius: 6px; padding: 5px 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.title { display: flex; flex-direction: column; gap: 6px; }
.trow { display: flex; gap: 5px; align-items: center; perspective: 600px; }
.tt { --w: clamp(30px, 12.4vw, 62px); width: var(--w); height: calc(var(--w) * 1.3); display: grid; place-items: center; flex: none;
  font-family: var(--f-board); font-weight: 900; font-size: calc(var(--w) * 1.12); line-height: 1; color: var(--amber);
  background: linear-gradient(180deg, #1B2546 0 50%, #0B1124 50% 100%); border-radius: 7px; position: relative;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09), 0 8px 18px rgba(0, 0, 0, .55); text-shadow: 0 0 16px rgba(255, 176, 0, .6);
  animation: flipin .75s cubic-bezier(.2, 1.2, .4, 1) both; animation-delay: calc(var(--i) * 70ms); }
.tt::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #03050A; box-shadow: 0 1px 0 rgba(255, 255, 255, .08); }
.tt.fp { animation: flapx .12s ease-in-out; }
.tt.plane { color: var(--amber); animation: flipin .75s cubic-bezier(.2, 1.2, .4, 1) both; animation-delay: .75s; }
.tt.plane svg { width: 70%; height: 70%; filter: drop-shadow(0 0 6px rgba(255, 176, 0, .7)); animation: takeoff 7s ease-in-out 2s infinite; }
@keyframes flipin { from { transform: rotateX(-95deg); opacity: 0; } 60% { transform: rotateX(14deg); opacity: 1; } to { transform: none; } }
@keyframes flapx { 0% { transform: rotateX(0); } 50% { transform: rotateX(-82deg); } 100% { transform: rotateX(0); } }
@keyframes takeoff { 0%, 72%, 100% { transform: translate(0, 0) rotate(-30deg); } 86% { transform: translate(60%, -60%) rotate(-30deg) scale(.6); opacity: 0; } 87% { transform: translate(-60%, 60%) rotate(-30deg) scale(.6); opacity: 0; } 95% { opacity: 1; } }
.flight svg { width: 100%; height: auto; display: block; overflow: visible; }
.sub { font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); }

/* Paneles */
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; position: relative; box-shadow: 0 14px 34px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06); }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
h2 { font-family: var(--f-board); font-weight: 800; font-size: 26px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; margin: 0; }
h2::after { content: ""; display: block; height: 4px; width: 44px; margin-top: 7px; border-radius: 2px; background: repeating-linear-gradient(-45deg, var(--amber) 0 5px, #05070D 5px 10px); }

input[type="text"] { font: inherit; font-size: 17px; color: var(--ink); background: rgba(0, 0, 0, .45); border: 2px solid var(--line-2); border-radius: 12px; padding: 13px 14px; width: 100%; min-width: 0; transition: border-color .2s, box-shadow .2s; -webkit-appearance: none; appearance: none; }
input[type="text"]::placeholder { color: var(--muted); opacity: .75; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
input[type="text"]:focus-visible { outline: none; border-color: var(--amber); box-shadow: 0 0 0 4px rgba(255, 176, 0, .2), 0 0 24px rgba(255, 176, 0, .18); }

.btn { border: 1.5px solid var(--line-2); background: rgba(255, 255, 255, .05); color: var(--ink); border-radius: 12px; padding: 11px 16px; font-weight: 700; min-height: 46px; white-space: nowrap; transition: background .15s, transform .1s; position: relative; overflow: hidden; -webkit-appearance: none; appearance: none; }
.btn:hover { background: rgba(255, 255, 255, .12); }
.btn.primary { background: var(--amber); border: 0; color: var(--amber-ink); font-family: var(--f-board); font-weight: 900; font-size: 20px; letter-spacing: .05em; text-transform: uppercase; white-space: normal; line-height: 1.05; padding-inline: 14px; box-shadow: 0 5px 0 #8A5C00, 0 12px 26px rgba(255, 176, 0, .25); }
.btn.primary:hover { background: var(--amber-2); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; width: 38%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .7), transparent); transform: skewX(-20deg); animation: shine 3.4s ease-in-out infinite; }
@keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
.btn.primary:active { transform: translateY(4px); box-shadow: 0 1px 0 #8A5C00; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.danger.solid { background: var(--red); color: #2b0007; border: 0; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 10px; }
.btn.ghost:hover { color: var(--ink); background: rgba(255, 255, 255, .08); }
.btn.big { width: 100%; min-height: 60px; }
#join-row .btn, #inrow .btn { flex: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn[disabled]::after { display: none; }

/* Avatares */
.av { --s: 44px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-board); font-weight: 900; font-size: calc(var(--s) * .56); line-height: 1; color: #070B14;
  background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .6), transparent 48%), var(--pc); box-shadow: 0 0 0 3px rgba(255, 255, 255, .12), 0 0 18px rgba(255, 255, 255, .0); }
.tag { font-family: var(--f-mono); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; background: rgba(255, 255, 255, .1); color: var(--muted); white-space: nowrap; }
.tag.me { background: var(--cyan); color: #04282B; }

/* Pases de abordar */
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.pass { display: flex; min-width: 0; border-radius: 14px; background: linear-gradient(135deg, #172242, #0D1428); border: 1px solid var(--line); position: relative; overflow: hidden; animation: slidein .5s cubic-bezier(.2, 1.2, .4, 1) both; box-shadow: 0 8px 20px rgba(0, 0, 0, .45); }
.pass::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 9px); pointer-events: none; }
@keyframes slidein { from { opacity: 0; transform: translateX(-30px) scale(.96); } }
.pass .stub { flex: none; width: 74px; background: var(--pc); color: #070B14; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; position: relative; }
.pass .stub .av { box-shadow: 0 0 0 3px rgba(5, 7, 13, .25); background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .5), transparent 50%), rgba(5, 7, 13, .22); color: #fff; }
.pass .stub .seat { font-family: var(--f-mono); font-weight: 700; font-size: 11px; letter-spacing: .1em; }
.pass .stub::after { content: ""; position: absolute; right: -1px; top: 10px; bottom: 10px; border-right: 2px dashed rgba(5, 7, 13, .6); }
.pass .stub::before { content: ""; position: absolute; right: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); box-shadow: 0 54px 0 0 transparent; z-index: 1; }
.pass .notch2 { position: absolute; left: 66px; bottom: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); z-index: 1; }
.pass .main { flex: 1; min-width: 0; padding: 10px 12px 8px 16px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.pass .nm { font-family: var(--f-board); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.pass .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pass .bars { height: 18px; width: 100%; max-width: 110px; opacity: .5; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px); }
.pass .acts { display: flex; gap: 2px; margin-left: -8px; }
.pass .acts .btn { padding: 6px 8px; min-height: 36px; font-size: 14px; }
.pass.edit .main { flex-direction: row; align-items: center; gap: 8px; }
.empty { text-align: center; padding: 20px 10px; border: 2px dashed var(--line-2); border-radius: 14px; }

/* Reglas */
.tiles { display: grid; grid-template-columns: 1fr; gap: 12px; }
.tile { background: #070C19; border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--tc); }
.tile .tn { font-weight: 700; line-height: 1.2; }
.tile .hint { font-size: 13px; color: var(--muted); line-height: 1.3; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
.stepper .btn { width: 42px; min-height: 42px; padding: 0; font-size: 24px; line-height: 1; border-radius: 50%; }
.val { font-family: var(--f-board); font-weight: 900; font-size: 40px; line-height: 1; color: var(--amber); background: linear-gradient(180deg, #172042 50%, #0A1022 50%); border-radius: 8px; padding: 3px 10px; min-width: 58px; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; position: relative; text-shadow: 0 0 12px rgba(255, 176, 0, .5); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.val::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #03050A; }
.val.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.25); } }
.switch { width: 66px; height: 36px; border-radius: 99px; border: 2px solid var(--line-2); background: rgba(255, 255, 255, .08); position: relative; padding: 0; margin-top: auto; transition: background .2s, border-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--muted); transition: transform .25s cubic-bezier(.3, 1.5, .5, 1); }
.switch[aria-checked="true"] { background: var(--green); border-color: var(--green); box-shadow: 0 0 16px rgba(79, 224, 138, .45); }
.switch[aria-checked="true"]::after { transform: translateX(30px); background: #06240F; }

/* Cinta de salidas */
.ticker { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #03050A; }
.ticker .lbl { flex: none; font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 0 10px; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; }
.ticker .win { overflow: hidden; flex: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.ticker .track { display: flex; width: max-content; padding: 9px 0; animation: marq 55s linear infinite; }
@keyframes marq { to { transform: translateX(-50%); } }
.tk-i { display: inline-flex; align-items: center; gap: 8px; margin-right: 28px; font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--amber-2); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.tk-i .fl { font-size: 20px; }
.fl { font-family: var(--f-emoji); line-height: 1; flex: none; }

/* Invitar */
.invite { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.qr { position: relative; background: #fff; padding: 9px; border-radius: 8px; width: 132px; height: 132px; flex: none; }
.qr::before, .qr::after { content: ""; position: absolute; width: 22px; height: 22px; border: 4px solid var(--amber); }
.qr::before { left: -7px; top: -7px; border-right: 0; border-bottom: 0; } .qr::after { right: -7px; bottom: -7px; border-left: 0; border-top: 0; }
.qr svg { width: 100%; height: 100%; display: block; }
.invlink { font-family: var(--f-mono); font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 4px; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
pre.code { background: rgba(0, 0, 0, .5); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; font-size: 13px; margin: 0; }
details summary { cursor: pointer; font-weight: 700; }
details ul { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* Contador con letras que giran */
.flaps { display: inline-flex; gap: 4px; --fw: 30px; }
.flaps.big { --fw: 44px; }
.fd { display: inline-grid; place-items: center; width: var(--fw); height: calc(var(--fw) * 1.35); font-family: var(--f-board); font-weight: 900; font-size: calc(var(--fw) * 1.2); line-height: 1; color: var(--amber); background: linear-gradient(180deg, #1B2546 50%, #0B1124 50%); border-radius: 6px; position: relative; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09), 0 5px 12px rgba(0, 0, 0, .5); text-shadow: 0 0 14px rgba(255, 176, 0, .55); font-variant-numeric: tabular-nums; }
.fd::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #03050A; }
.fd.flip { animation: flap .38s ease-out; }
@keyframes flap { 0% { transform: perspective(300px) rotateX(-90deg); } 100% { transform: none; } }

/* Mapa */
.board { padding: 16px; border-radius: 18px; background: linear-gradient(160deg, #101C3F, #070B18 72%); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; box-shadow: 0 14px 34px rgba(0, 0, 0, .55); }
.bhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.bhead .k { margin-bottom: 6px; }
.bstat { text-align: right; }
.rnum { font-family: var(--f-board); font-weight: 900; font-size: 46px; line-height: .9; color: var(--ink); }
.board .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.map { width: 100%; height: auto; display: block; overflow: visible; }
.map .grat { stroke: rgba(255, 255, 255, .08); stroke-width: .4; }
.map .grat.eq { stroke: rgba(255, 176, 0, .28); stroke-dasharray: 2 3; }
.map .mp { fill: rgba(255, 255, 255, .3); }
.map .mp.on { stroke: rgba(255, 255, 255, .5); stroke-width: .5; }
.map .mp.fresh { animation: mpp .9s ease-out both; transform-box: fill-box; transform-origin: center; }
@keyframes mpp { 0% { transform: scale(.2); } 40% { transform: scale(3.4); } 100% { transform: scale(1); } }
.flagpop { position: fixed; font-family: var(--f-emoji); font-size: 30px; z-index: 55; pointer-events: none; animation: fpop 1.4s ease-out forwards; }
@keyframes fpop { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 25% { transform: translate(-50%, -90%) scale(1.7); opacity: 1; } 100% { transform: translate(-50%, -190%) scale(1.1); opacity: 0; } }

/* Turno */
.turn { --pc: #fff; border: 2px solid transparent; border-radius: 20px;
  background: linear-gradient(var(--panel-2), var(--panel)) padding-box, conic-gradient(from var(--ang), var(--pc), transparent 28%, var(--pc) 55%, transparent 80%, var(--pc)) border-box;
  animation: spin 3.6s linear infinite; box-shadow: 0 0 40px rgba(255, 255, 255, .05), 0 20px 40px rgba(0, 0, 0, .55); }
@keyframes spin { to { --ang: 360deg; } }
.gate { display: flex; align-items: center; gap: 12px; min-width: 0; }
.gate.turnin { animation: turnin .55s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes turnin { from { opacity: 0; transform: translateX(40px) scale(.92); } }
.turn .who { font-family: var(--f-board); font-weight: 900; font-size: clamp(30px, 9.6vw, 46px); line-height: .95; text-transform: uppercase; overflow-wrap: anywhere; letter-spacing: .01em; }
.k.yt { background: var(--amber); color: var(--amber-ink); padding: 3px 9px; border-radius: 5px; width: fit-content; animation: yt 1s ease-in-out infinite alternate; }
@keyframes yt { to { transform: scale(1.07); box-shadow: 0 0 18px rgba(255, 176, 0, .7); } }
.clock { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: none; }
.clock .k { font-size: 9px; }
.lights { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
.lights i { height: 8px; border-radius: 2px; background: var(--amber); box-shadow: 0 0 6px rgba(255, 176, 0, .65); transition: background .25s, box-shadow .25s; }
.lights i.off { background: rgba(255, 255, 255, .1); box-shadow: none; }
.turn.low .fd { color: var(--red); text-shadow: 0 0 14px rgba(255, 77, 94, .7); }
.turn.low .lights i:not(.off) { background: var(--red); box-shadow: 0 0 7px rgba(255, 77, 94, .8); }
.turn.low .clock .fd { animation: beat .5s ease-in-out infinite alternate; }
@keyframes beat { to { transform: scale(1.08); } }

.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.slot { min-height: 66px; border: 2px dashed var(--line-2); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; color: var(--muted); min-width: 0; }
.slot .num { font-family: var(--f-board); font-weight: 800; font-size: 28px; opacity: .5; }
.slot .sn { font-family: var(--f-stamp); font-size: 15px; line-height: 1.1; text-transform: uppercase; overflow-wrap: break-word; min-width: 0; }
.slot .fl { font-size: 32px; }
.slot.active { border-color: var(--amber); color: var(--ink); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { background: rgba(255, 176, 0, .12); } }
.slot.done { border: 2.5px double var(--pc); color: var(--pc); background: rgba(255, 255, 255, .05); background: color-mix(in srgb, var(--pc) 10%, transparent); transform: rotate(var(--rot, -2deg)); animation: stampin .5s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes stampin { 0% { transform: scale(2.3) rotate(calc(var(--rot, -2deg) * 3)); opacity: 0; } 55% { opacity: 1; } 100% { transform: scale(1) rotate(var(--rot, -2deg)); } }
.fields { display: flex; flex-direction: column; gap: 10px; }
.err { color: #FFB3BD; background: rgba(255, 77, 94, .14); border: 1px solid rgba(255, 77, 94, .5); border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 15px; animation: rise .3s both; }
.shake { animation: shake .45s; }
@keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
.thinking { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); }
.thinking .tk { flex: 1; min-width: 0; font-family: var(--f-mono); font-size: 14px; overflow-wrap: anywhere; }
.thinking .tk b { font-family: var(--f-board); font-weight: 800; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; }
.dots3 { display: inline-flex; gap: 5px; }
.dots3 i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); animation: dotb 1.1s ease-in-out infinite; }
.dots3 i:nth-child(2) { animation-delay: .15s; } .dots3 i:nth-child(3) { animation-delay: .3s; }
@keyframes dotb { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-8px); opacity: 1; } }

/* Pasajeros */
.pstrip { display: flex; flex-wrap: wrap; gap: 14px; }
.pchip { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; position: relative; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
.pchip .n { font-family: var(--f-mono); font-size: 11px; font-weight: 700; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avwrap { position: relative; }
.cnt { position: absolute; top: -6px; right: -9px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; background: var(--ink); color: #070B14; font-family: var(--f-mono); font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
.pchip.cur .av { animation: ping 1.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--pc), 0 0 0 3px rgba(255, 255, 255, .12); } 100% { box-shadow: 0 0 0 18px transparent, 0 0 0 3px rgba(255, 255, 255, .12); } }
.pchip.out .av { filter: grayscale(1) brightness(.5); }
.pchip.out .n { text-decoration: line-through; color: var(--muted); }
.pchip.out::after { content: "✕"; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 800; color: var(--red); text-shadow: 0 0 10px var(--red); }
.pop { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* Pasaporte */
.book { display: flex; flex-wrap: wrap; gap: 16px 12px; padding: 16px 10px; border-radius: 12px; border: 1px dashed var(--line-2); background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 24px); }
.stamp { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; min-width: 96px; max-width: 100%; border: 2.5px double var(--pc); color: var(--pc); border-radius: 10px; transform: rotate(var(--rot, 0deg)); font-family: var(--f-stamp); text-align: center; background: rgba(255, 255, 255, .04); background: color-mix(in srgb, var(--pc) 8%, transparent); animation: stampin .55s cubic-bezier(.2, 1.5, .4, 1) both; }
.stamp .fl { font-size: 28px; }
.stamp .sn { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; line-height: 1.1; }
.stamp .by { font-size: 10px; opacity: .8; letter-spacing: .06em; }
.stamp.s2 { border-radius: 50% / 42%; padding: 12px 20px; }
.stamp.s3 { border-style: solid; border-width: 2px; outline: 2px dashed var(--pc); outline-offset: 3px; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-family: var(--f-mono); font-size: 13px; }
.log li { padding: 6px 10px; border-left: 4px solid var(--line-2); background: rgba(0, 0, 0, .3); border-radius: 0 8px 8px 0; overflow-wrap: anywhere; animation: slidein .4s both; }
.log li.out { border-color: var(--red); }
.log li.win { border-color: var(--green); font-weight: 700; }
.log .r { color: var(--amber); font-weight: 700; margin-right: 8px; }

/* Final */
.winner { text-align: center; align-items: center; padding: 28px 16px; gap: 12px; position: relative; overflow: hidden; }
.winner > * { position: relative; z-index: 1; }
.winner::before { content: ""; position: absolute; left: 50%; top: 36%; width: 540px; height: 540px; margin: -270px 0 0 -270px; z-index: 0; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 176, 0, .2) 0 10deg, transparent 10deg 20deg);
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 68%); mask-image: radial-gradient(circle, #000 0, transparent 68%); animation: rot 20s linear infinite; }
.winner .crown { width: 84px; animation: bob 1.8s ease-in-out infinite; filter: drop-shadow(0 0 16px rgba(255, 176, 0, .7)); }
@keyframes bob { 50% { transform: translateY(-8px) rotate(3deg); } }
.winner .wname { font-family: var(--f-board); font-weight: 900; font-size: clamp(46px, 15vw, 80px); line-height: .95; text-transform: uppercase; overflow-wrap: anywhere; color: var(--amber); text-shadow: 0 4px 30px rgba(255, 176, 0, .5); }
.approved { font-family: var(--f-stamp); font-size: 22px; text-transform: uppercase; letter-spacing: .1em; color: var(--green); border: 4px double var(--green); padding: 4px 16px; border-radius: 8px; transform: rotate(-9deg); animation: stampin .6s cubic-bezier(.2, 1.5, .4, 1) .9s both; --rot: -9deg; }
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 10px; }
.podium .step { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; animation: rise .7s both; }
.podium .pn { font-family: var(--f-board); font-weight: 800; font-size: 20px; text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .blk { width: 100%; border-radius: 10px 10px 0 0; display: grid; place-items: center; font-family: var(--f-board); font-weight: 900; font-size: 34px; color: #070B14; background: linear-gradient(var(--pc), rgba(0, 0, 0, .0)), var(--pc); box-shadow: 0 0 24px rgba(255, 255, 255, .08); }
.podium .r1 .blk { height: 112px; } .podium .r2 .blk { height: 78px; } .podium .r3 .blk { height: 56px; }
.podium .r1 { animation-delay: .55s; } .podium .r2 { animation-delay: .3s; } .podium .r3 { animation-delay: .05s; }

.notice { border: 1.5px solid var(--amber); color: var(--amber); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; background: rgba(255, 176, 0, .08); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 10px; font-weight: 700; font-size: 15px; max-width: calc(100% - 32px); z-index: 20; animation: rise .3s both; }

/* Efectos a pantalla completa */
.ov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; padding: 24px; cursor: pointer; animation: ovin .2s both; }
.ov.denied { background: radial-gradient(circle at 50% 45%, rgba(255, 77, 94, .45), rgba(5, 7, 13, .95) 70%); }
.ov.bye { animation: ovout .5s both; }
.ov-in { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; }
.denied-stamp { font-family: var(--f-stamp); font-size: clamp(40px, 14vw, 92px); line-height: 1; text-transform: uppercase; letter-spacing: .06em; color: var(--red); border: 7px double var(--red); border-radius: 10px; padding: .08em .3em; transform: rotate(-8deg); box-shadow: 0 0 50px rgba(255, 77, 94, .45), inset 0 0 30px rgba(255, 77, 94, .2); text-shadow: 0 0 24px rgba(255, 77, 94, .7); animation: slamstamp .45s cubic-bezier(.2, 1.6, .4, 1) both; max-width: 100%; }
@keyframes slamstamp { 0% { transform: scale(3.2) rotate(-24deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
.ov-name { font-family: var(--f-board); font-weight: 900; font-size: clamp(34px, 11vw, 56px); text-transform: uppercase; overflow-wrap: anywhere; margin-top: 14px; animation: rise .4s .25s both; }
.ov-sub { font-family: var(--f-mono); color: var(--muted); font-size: 14px; animation: rise .4s .35s both; }
@keyframes ovin { from { opacity: 0; } }
@keyframes ovout { to { opacity: 0; } }
.band { position: fixed; left: -4%; right: -4%; top: 38%; z-index: 50; padding: 14px 16px; text-align: center; background: var(--amber); color: var(--amber-ink); transform: rotate(-3deg); pointer-events: none;
  border-block: 8px solid transparent; border-image: repeating-linear-gradient(-45deg, #05070D 0 12px, var(--amber) 12px 24px) 8; box-shadow: 0 0 70px rgba(255, 176, 0, .5); animation: bandin .4s cubic-bezier(.2, 1.2, .4, 1) both, bandout .35s 1.25s both; }
.band-t { font-family: var(--f-board); font-weight: 900; font-size: clamp(44px, 15vw, 84px); line-height: 1; letter-spacing: .06em; text-transform: uppercase; }
.band-s { font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
@keyframes bandin { from { transform: translateX(-110%) rotate(-3deg); } }
@keyframes bandout { to { transform: translateX(110%) rotate(-3deg); opacity: 0; } }
.quake { animation: quake .6s; }
@keyframes quake { 10%, 50%, 90% { transform: translate(-6px, 3px); } 30%, 70% { transform: translate(6px, -3px); } }
.spark { position: fixed; width: 9px; height: 9px; border-radius: 50%; z-index: 55; pointer-events: none; animation: spark .75s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
.floater { position: fixed; transform: translate(-50%, 0); font-family: var(--f-board); font-weight: 900; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; color: var(--amber); text-shadow: 0 0 14px rgba(255, 176, 0, .8); z-index: 56; pointer-events: none; animation: floatup 1s ease-out forwards; white-space: nowrap; }
@keyframes floatup { to { transform: translate(-50%, -70px); opacity: 0; } }
.confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; }

@media (max-width: 370px) {
  body { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .panel { padding: 14px 12px; }
  .pass .stub { width: 60px; }
  .pass .notch2 { left: 52px; }
  .pass .nm { font-size: 26px; }
  .pass .bars { display: none; }
  .flaps.big { --fw: 38px; }
  .qr { width: 116px; height: 116px; }
}
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, 1fr); } .val { font-size: 34px; min-width: 50px; } }
@media (min-width: 700px) { body { padding-top: 30px; } }

  #bgfx .fflag, #bgfx .star, .radar { display: none; }
}

function lev(a, b) {

}

  if (!connected && slow) notices.push(h('div', { class: 'notice', id: 'notice', role: 'status', text: standalone ? 'No se pudo conectar con la base de datos' + (connErr ? ' (' + connErr + ')' : '') + '. Revisá la configuración de Firebase y las reglas.' : 'No hay conexión con la partida todavía. Si el problema sigue, abrí el link con tu sesión iniciada.' }));
  const next = h('div', { id: 'app' }, h('div', { class: 'wrap' }, headerView(), notices, tickerView(), body, toastMsg ? h('div', { class: 'toast', id: 'toast', role: 'status', text: toastMsg }) : null));
  if (window.morphdom) morphdom($app, next, { onBeforeElUpdated: keepNode });
  else $app.replaceChildren(...next.childNodes);

  const bn = document.getElementById('bignum');
  if (bn) setFlaps(bn, bn.dataset.v, 3);
  document.querySelectorAll('.stepper .val').forEach(v => {
    if (v.dataset.shown !== undefined && v.dataset.shown !== v.dataset.v) retrigger(v, 'bump');
    v.dataset.shown = v.dataset.v;
  });
  if (S.phase === 'playing') {
    const key = S.round + ':' + S.cur;
    if (lastCur !== key) {
      retrigger(document.getElementById('turnhead'), 'turnin');
      if (lastCur !== null) sfx.turn();
      lastCur = key;
    }
    if (burstTarget) {
      burstTarget = false;
      burstAt(document.querySelector('#slots .slot.done:last-of-type') || document.getElementById('turn'));
      fresh.forEach(k => { const i = IDX.get(k); if (i != null) flagPop(document.getElementById('mp-' + i), (COUNTRIES[i] || {}).c); });
    }
    const ti = document.getElementById('turn-input');
    if (ti && canActNow && focusedFor !== key) { focusedFor = key; if (!(document.activeElement && document.activeElement.tagName === 'INPUT')) ti.focus(); }
  } else { lastCur = null; focusedFor = null; burstTarget = false; document.getElementById('vig').classList.remove('on'); }
  fresh = new Set();
  tick();
}

/* ---------- Reloj ---------- */
let lastTry = 0, enforcing = false;
function tick() {
  if (S.phase !== 'playing' || !S.deadline) return;
  const tn = document.getElementById('tnum'); if (!tn) return;
  const rem = S.deadline - Date.now();
  const lab = document.getElementById('think-label');
  if (lab) { const cp0 = S.roster[S.cur]; const ty = typingSeen && cp0 && typingSeen.id === cp0.id && Date.now() - typingSeen.t < 3000; const txt = ty ? ' está escribiendo' : ' está respondiendo'; if (lab.textContent !== txt) lab.textContent = txt; }
  const total = Math.max(MIN_SEC, S.config.seconds || 30) * 1000;
  const sec = Math.max(0, Math.ceil(rem / 1000));
  if (tn.dataset.s !== String(sec)) {
    tn.dataset.s = String(sec); setFlaps(tn, sec, 2);
    if (canActNow && sec > 0 && sec <= 5) sfx.tick();
  }
  const lights = document.getElementById('lights');
  if (lights) { const on = Math.round(24 * Math.max(0, Math.min(1, rem / total))); [...lights.children].forEach((e, i) => e.classList.toggle('off', i >= on)); }
  document.getElementById('turn').classList.toggle('low', rem < 10000);
  document.getElementById('vig').classList.toggle('on', rem < 5000 && rem > -1500 && canActNow);
  const btn = document.getElementById('timeout-btn');
  if (btn) btn.hidden = rem > -4000;
  if (((rem < -1500 && S.hostId === uid) || rem < -6000) && !busy && !enforcing && Date.now() - lastTry > 3000) {
    lastTry = Date.now(); enforcing = true;
    actTimeout(S.seq).finally(() => { enforcing = false; });
  }
}
setInterval(tick, 400);
setInterval(() => {
  const ts = document.querySelectorAll('#title .tt[data-ch]'); if (!ts.length || reduced()) return;
  const t = ts[Math.floor(Math.random() * ts.length)], ch = t.dataset.ch;
  t.classList.add('fp'); setTimeout(() => { t.textContent = 'ABCDEFGHIJKLMNOPRSTUV'[Math.floor(Math.random() * 21)]; }, 60);
  setTimeout(() => { t.textContent = ch; t.classList.remove('fp'); }, 160);
}, 3800);

function wireTyping(ref) {
  typingRef = ref;
  let first = true;
  ref.onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    if (first) { first = false; return; }
    if (d) typingSeen = { id: d.id, t: Date.now() };
  }, () => {});
}
function listen() {
  stateRef.onSnapshot(snap => {
    connected = true;
    setState(snap.exists ? { ...defaultState(), ...snap.data() } : defaultState());
  }, () => { slow = true; render(); });
  playersRef.onSnapshot(q => {
    connected = true;
    P = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.at || 0) - (b.at || 0));
    render();
  }, () => { slow = true; render(); });
}
async function bootArtifact() {
  const claude = window.claude;
  setTimeout(() => { if (!connected) { slow = true; render(); } }, 10000);
  try { const user = await claude.use('user'); uid = user ? await user.id() : null; } catch (e) { uid = null; }
  if (!uid) uid = localId();
  db = await claude.use('db');
  if (!db) { slow = true; render(); return; }
  stateRef = db.doc('game/state');
  playersRef = db.collection('players');
  wireTyping(db.doc('game/typing'));
  listen();
}
async function bootFirebase() {
  standalone = true;
  uid = localId();
  if (!FIREBASE_CONFIG.databaseURL) { needSetup = true; render(); return; }
  setTimeout(() => { if (!connected) { slow = true; render(); } }, 10000);
  try {
    const V = '10.14.1';
    const [appm, dbm] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`)]);
    const rdb = dbm.getDatabase(appm.initializeApp(FIREBASE_CONFIG));
    const R = path => dbm.ref(rdb, 'ultimopais/' + ROOM + path);
    const clean = o => JSON.parse(JSON.stringify(o));
    const snapOf = v => ({ exists: v !== null && v !== undefined, data: () => v });
    stateRef = {
      onSnapshot: (cb, err) => dbm.onValue(R('/state'), s => cb(snapOf(s.val())), err),
      transact: async fn => {
        let out = null;
        await dbm.runTransaction(R('/state'), cur => {
          const c = { ...defaultState(), ...(cur ? clean(cur) : {}) };
          const res = fn(c);
          out = res;
          if (!res || res.error) return;
          res.state.seq = (c.seq || 0) + 1;
          return clean(res.state);
        });
        return out;
      }
    };
    playersRef = {
      doc: id => ({
        set: d => dbm.set(R('/players/' + id), clean(d)),
        update: d => dbm.update(R('/players/' + id), clean(d)),
        delete: () => dbm.remove(R('/players/' + id))
      }),
      onSnapshot: (cb, err) => dbm.onValue(R('/players'), s => {
        const v = s.val() || {};
        cb({ docs: Object.entries(v).map(([id, d]) => ({ id, data: () => d })) });
      }, err)
    };
    wireTyping({ set: d => dbm.set(R('/typing'), clean(d)), onSnapshot: (cb, err) => dbm.onValue(R('/typing'), s => cb(snapOf(s.val())), err) });
    listen();
  } catch (e) { console.error(e); connErr = String((e && e.message) || e).slice(0, 120); slow = true; render(); }
}
(async function boot() {
  render();
  try { if (window.claude && window.claude.use) await bootArtifact(); else await bootFirebase(); }
  catch (e) { console.error(e); connErr = String((e && e.message) || e).slice(0, 120); slow = true; render(); }
})();
